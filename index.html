<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Adham Elsharkawe — Portfolio</title>

<meta name="description" content="Adham Elsharkawe — Computer Science student, Media Buyer and Freelancer.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#050505;
    --bg-soft:#0a0a0a;
    --card:#0d0d0d;
    --card-hover:#121212;
    --white:#ffffff;
    --text:#eeeeee;
    --muted:#8b8b8b;
    --border:rgba(255,255,255,.09);
    --border-hover:rgba(255,255,255,.22);
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:"Inter",Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.6;
    overflow-x:hidden;
}

/* =========================
   BACKGROUND
========================= */

body::before{
    content:"";
    position:fixed;
    width:600px;
    height:600px;
    top:-300px;
    right:-200px;
    background:rgba(255,255,255,.055);
    filter:blur(150px);
    border-radius:50%;
    pointer-events:none;
    z-index:-1;
}

body::after{
    content:"";
    position:fixed;
    width:500px;
    height:500px;
    bottom:-300px;
    left:-200px;
    background:rgba(255,255,255,.035);
    filter:blur(150px);
    border-radius:50%;
    pointer-events:none;
    z-index:-1;
}

::selection{
    background:#fff;
    color:#000;
}

.container{
    width:min(1180px,90%);
    margin:auto;
}

/* =========================
   NAVBAR
========================= */

nav{
    height:85px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--border);
}

.logo{
    color:#fff;
    text-decoration:none;
    font-size:18px;
    font-weight:900;
    letter-spacing:-.7px;
}

.logo span{
    color:#555;
}

.nav-links{
    display:flex;
    align-items:center;
    gap:34px;
    list-style:none;
}

.nav-links a{
    color:#777;
    text-decoration:none;
    font-size:11px;
    font-weight:700;
    letter-spacing:1.5px;
    text-transform:uppercase;
    transition:.3s;
}

.nav-links a:hover{
    color:#fff;
}

.nav-contact{
    color:#000;
    background:#fff;
    text-decoration:none;
    padding:11px 19px;
    border-radius:100px;
    font-size:11px;
    font-weight:800;
    transition:.3s;
}

.nav-contact:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 35px rgba(255,255,255,.12);
}

/* =========================
   HERO
========================= */

.hero{
    min-height:calc(100vh - 85px);
    display:flex;
    align-items:center;
    position:relative;
    padding:100px 0;
}

.hero-content{
    max-width:1000px;
}

.status{
    display:inline-flex;
    align-items:center;
    gap:9px;
    padding:8px 13px;
    border:1px solid var(--border);
    border-radius:100px;
    color:#999;
    font-size:10px;
    font-weight:600;
    letter-spacing:1px;
    margin-bottom:28px;
    background:rgba(255,255,255,.025);
}

.status-dot{
    width:6px;
    height:6px;
    background:#fff;
    border-radius:50%;
    box-shadow:0 0 12px #fff;
}

.hero h1{
    font-size:clamp(60px,10vw,135px);
    line-height:.86;
    letter-spacing:-8px;
    font-weight:900;
}

.hero h1 .gray{
    color:#555;
}

.hero-description{
    max-width:650px;
    margin-top:35px;
    color:#8b8b8b;
    font-size:16px;
    line-height:1.8;
}

.hero-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:35px;
}

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    padding:14px 22px;
    border-radius:100px;
    font-size:11px;
    font-weight:800;
    letter-spacing:.8px;
    transition:.35s;
}

.btn-primary{
    background:#fff;
    color:#000;
}

.btn-primary:hover{
    transform:translateY(-4px);
    box-shadow:0 15px 40px rgba(255,255,255,.14);
}

.btn-outline{
    color:#fff;
    border:1px solid var(--border-hover);
}

.btn-outline:hover{
    background:#fff;
    color:#000;
    transform:translateY(-4px);
}

.hero-scroll{
    position:absolute;
    bottom:30px;
    right:0;
    color:#555;
    font-size:9px;
    letter-spacing:3px;
    text-transform:uppercase;
}

/* =========================
   GENERAL SECTIONS
========================= */

section{
    padding:125px 0;
    border-top:1px solid rgba(255,255,255,.06);
}

.section-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    margin-bottom:55px;
}

.section-label{
    color:#555;
    font-size:10px;
    letter-spacing:3px;
    font-weight:700;
    text-transform:uppercase;
    margin-bottom:12px;
}

.section-title{
    font-size:clamp(42px,6vw,76px);
    line-height:.9;
    letter-spacing:-5px;
    font-weight:900;
}

.section-number{
    color:#444;
    font-size:11px;
    letter-spacing:3px;
}

/* =========================
   ABOUT
========================= */

.about-grid{
    display:grid;
    grid-template-columns:1.2fr .8fr;
    gap:18px;
}

.about-main,
.about-side{
    border:1px solid var(--border);
    background:linear-gradient(145deg,#101010,#080808);
    border-radius:28px;
    padding:42px;
}

.about-main h3{
    font-size:32px;
    line-height:1.2;
    margin-bottom:20px;
}

.about-main p{
    color:#858585;
    font-size:15px;
    max-width:650px;
}

.about-side{
    display:flex;
    flex-direction:column;
    justify-content:space-between;
}

.info{
    padding-bottom:24px;
    margin-bottom:24px;
    border-bottom:1px solid var(--border);
}

.info:last-child{
    padding:0;
    margin:0;
    border:0;
}

.info-label{
    color:#555;
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:2px;
    margin-bottom:7px;
}

.info-value{
    font-size:15px;
    font-weight:600;
}

/* =========================
   SERVICES
========================= */

.services{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.service{
    min-height:260px;
    border:1px solid var(--border);
    border-radius:25px;
    padding:32px;
    background:#0b0b0b;
    transition:.4s;
    position:relative;
    overflow:hidden;
}

.service::after{
    content:"";
    position:absolute;
    width:120px;
    height:120px;
    background:rgba(255,255,255,.04);
    border-radius:50%;
    filter:blur(45px);
    right:-50px;
    top:-50px;
}

.service:hover{
    transform:translateY(-8px);
    background:var(--card-hover);
    border-color:var(--border-hover);
}

.service-number{
    color:#444;
    font-size:11px;
    font-weight:800;
    letter-spacing:2px;
}

.service h3{
    margin-top:65px;
    font-size:23px;
}

.service p{
    color:#777;
    font-size:13px;
    margin-top:10px;
}

/* =========================
   SKILLS
========================= */

.skills-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
}

.skill{
    border:1px solid var(--border);
    background:#0b0b0b;
    padding:24px 27px;
    border-radius:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    transition:.3s;
}

.skill:hover{
    border-color:var(--border-hover);
    transform:translateX(5px);
}

.skill-name{
    font-size:14px;
    font-weight:700;
}

.skill-type{
    color:#555;
    font-size:10px;
    letter-spacing:1px;
}

/* =========================
   PROJECTS
========================= */

.projects{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
}

.project{
    border:1px solid var(--border);
    border-radius:28px;
    overflow:hidden;
    background:#0b0b0b;
    transition:.4s;
}

.project:hover{
    transform:translateY(-8px);
    border-color:var(--border-hover);
}

.project-visual{
    height:260px;
    position:relative;
    background:
        radial-gradient(circle at 70% 30%,rgba(255,255,255,.12),transparent 20%),
        linear-gradient(135deg,#181818,#070707);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.project-visual::before{
    content:"";
    position:absolute;
    width:260px;
    height:260px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:50%;
}

.project-visual span{
    position:relative;
    z-index:1;
    font-size:42px;
    font-weight:900;
    letter-spacing:-3px;
}

.project-info{
    padding:27px;
}

.project-category{
    color:#555;
    font-size:9px;
    letter-spacing:2px;
    text-transform:uppercase;
}

.project h3{
    margin-top:8px;
    font-size:24px;
}

.project p{
    color:#777;
    font-size:13px;
    margin-top:8px;
}

.project-link{
    display:inline-block;
    margin-top:20px;
    color:#fff;
    text-decoration:none;
    font-size:10px;
    font-weight:800;
    letter-spacing:1px;
    border-bottom:1px solid #444;
    padding-bottom:4px;
}

/* =========================
   CONTACT
========================= */

.contact-box{
    border:1px solid var(--border);
    border-radius:32px;
    padding:70px;
    position:relative;
    overflow:hidden;
    background:
        radial-gradient(circle at 90% 0%,rgba(255,255,255,.1),transparent 32%),
        #0b0b0b;
}

.contact-box h2{
    max-width:800px;
    font-size:clamp(48px,7vw,90px);
    line-height:.88;
    letter-spacing:-6px;
    font-weight:900;
}

.contact-box p{
    color:#777;
    max-width:550px;
    margin-top:25px;
    font-size:15px;
}

.contact-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:32px;
}
